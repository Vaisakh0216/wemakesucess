# Cloudflare Pages project config (static app in dist/, API in functions/).
name = "wemakesucess"
pages_build_output_dir = "dist"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Headless Chrome for server-rendered PDFs (Cloudflare Browser Rendering).
[browser]
binding = "BROWSER"

# Secrets are NOT set here. Add them in the dashboard (Settings → Variables and Secrets)
# or with `npx wrangler pages secret put NAME`:
#   RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, UNLOCK_SECRET
# For local dev, put them in .dev.vars (git-ignored); see .dev.vars.example.
